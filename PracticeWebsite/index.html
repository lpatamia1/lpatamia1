<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Job Application Tracker</h1>
    <p>Tracking my 2025 applications with HTML, CSS, and JavaScript.</p>
    <p>This is the first page.</p>

    <div id="searchContainer">
    <input 
        type="text" 
        id="searchInput" 
        placeholder="Search jobs..."
    />
    <p id="resultCount"></p>
    </div>

    <main>
        <section id="jobTableSection">
            <h2>📋 Applications</h2>
            <table id="jobsTable">
                <thead>
                    <tr>
                        <th>Company</th>
                        <th>Role</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="tableBody">

                </tbody>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
