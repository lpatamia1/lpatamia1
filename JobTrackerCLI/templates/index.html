<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
  <style>
    body { padding: 2rem; background: #f9f4fb; color: #333; }
    h1 { text-align: center; color: #9b59b6; }
    canvas { margin: 2rem auto; display: block; max-width: 700px; }
  </style>
</head>
<body>
  <h1>📊 Job Application Dashboard</h1>
  <p style="text-align:center;">Total Applications: <b>{{ total }}</b></p>

  <h3>Status Distribution</h3>
  <canvas id="statusChart"></canvas>

  <h3>Top Sources</h3>
  <canvas id="sourceChart"></canvas>

  <h3>Weekly Application Trend</h3>
  <canvas id="timelineChart"></canvas>

  <script>
    const statusData = {{ by_status|tojson }};
    const sourceData = {{ by_source|tojson }};
    const weeklyData = {{ weekly_apps|tojson }};
  </script>
  <script src="/static/charts.js"></script>
</body>
</html>
