<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">

  <style>
    :root {
      --lavender: #c084fc;
      --green: #22c55e;
      --pink: #ec4899;
      --blue: #60a5fa;
      --bg: #f9f4fb;
      --text: #2b2b2b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", sans-serif;
      margin: 0;
    }

    /* 🌈 HERO HEADER */
    header {
      background: linear-gradient(100deg, #c084fc, #a78bfa, #60a5fa);
      color: white;
      text-align: center;
      padding: 3.2rem 1rem 4rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    header::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.25), transparent 50%);
      animation: pulse 8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.6px;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      position: relative;
      z-index: 2;
    }

    .subtitle {
      font-size: 1.15em;
      margin-top: 0.6rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
    }

    .metric-cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 2rem;
      position: relative;
      z-index: 2;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 1rem 1.5rem;
      color: #fff;
      min-width: 160px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: transform 0.25s ease;
    }

    .metric-card:hover {
      transform: translateY(-4px);
    }

    .metric-card h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .metric-card p {
      margin: 0.3rem 0 0;
      font-size: 1.3rem;
      font-weight: 700;
    }

    /* 🌸 Layout below stays the same */
    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    section {
      background: rgba(217, 216, 238, 0.95); 
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem auto;
      max-width: 950px; 
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
      display: flex;

    }

    section:hover { transform: translateY(-2px); }

    section h2 {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 600;
      margin-top: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.4rem;
      color: #4f4848;
    }

    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
      margin: 0 auto;
      max-width: 650px;
    }

    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      background: linear-gradient(to right, #f9f4fb, #faf5ff);
      padding: 1rem 0 1.2rem;
      border-top: 1px solid #eee;
      letter-spacing: 0.3px;
    }

  </style>
</head>

<body>
  <header>
    <h1>📈 Job Application Dashboard</h1>
    <p class="subtitle">Tracking progress, insights, and wins 🌟</p>

    <div class="metric-cards">
      <div class="metric-card">
        <h3>Total Applications</h3>
        <p>{{ total }}</p>
      </div>
      <div class="metric-card">
        <h3>Interviews</h3>
        <p>{{ interviews }}</p>
      </div>
      <div class="metric-card">
        <h3>Rejected</h3>
        <p>{{ rejected }}</p>
      </div>
      <div class="metric-card">
        <h3>Hired</h3>
        <p>{{ hired }}</p>
      </div>
    </div>
  </header>

  <main>
    <section>
      <canvas id="statusChart"></canvas>
    </section>


    <section>
      <canvas id="sourceChart" height="300"></canvas>
    </section>

    <section>
      <canvas id="timelineChart" height="200"></canvas>
    </section>
  </main>

<footer>
  <p>
    <span style="color:#b17897;">💻</span> Built with care by 
    <strong style="color:#4e6a57;">Lily Patamia</strong> 
    <span style="opacity:0.8;">|</span> ☕ Powered by matcha 
    <span style="opacity:0.8;">|</span> Auto-refresh every 
    <span style="color:#48724b;">30s</span>
  </p>
</footer>


  <script>
    const statusData = {{ by_status | tojson }};
    const sourceData = {{ by_source | tojson }};
    const weeklyData = {{ weekly_apps | tojson }};
  </script>
  <script src="{{ url_for('static', filename='charts.js') }}"></script>
</body>
</html>
