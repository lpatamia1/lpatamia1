name: snake

on:
  # Allows manual trigger from Actions tab
  workflow_dispatch:

  # Runs daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Step 1 — Generate pink snake SVGs
      - name: Generate github-contribution-grid-snake.svg (pink theme)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=ff69b4&color_dots=#ffb6c1,#ffc0cb,#ff69b4,#ff1493,#ffb6c1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=ff69b4&color_dots=#ffc0cb,#ffb6c1,#ff69b4,#ff1493,#ffc0cb

      # Step 2 — Push generated files to the output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
