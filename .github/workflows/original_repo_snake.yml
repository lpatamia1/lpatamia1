name: Generate Pink Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate default snake
        uses: Platane/snk@v3
        with:
          github_user_name: lpatamia1
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 💕 copy, then recolor
      - name: Copy and recolor snake to pink
        run: |
          mkdir pinksnake
          cp dist/github-contribution-grid-snake*.svg pinksnake/
          # Replace every known green shade used by Platane/snk
          sed -i 's/#40c463/#ff69b4/g' pinksnake/github-contribution-grid-snake*.svg
          sed -i 's/#30a14e/#ffb6c1/g' pinksnake/github-contribution-grid-snake*.svg
          sed -i 's/#216e39/#ff1493/g' pinksnake/github-contribution-grid-snake*.svg
          sed -i 's/#9be9a8/#ffc0cb/g' pinksnake/github-contribution-grid-snake*.svg
          sed -i 's/#26a641/#ff8cbf/g' pinksnake/github-contribution-grid-snake*.svg
          sed -i 's/#57ab5a/#ff9fc9/g' pinksnake/github-contribution-grid-snake*.svg
          sed -i 's/#28a745/#ff7ab8/g' pinksnake/github-contribution-grid-snake*.svg


      - name: Push pink snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: pinksnake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
