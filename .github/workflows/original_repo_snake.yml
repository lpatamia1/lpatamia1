name: Generate Pink Snake from original repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # every day

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate default snake
        uses: Platane/snk@v3
        with:
          github_user_name: lpatamia1
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 💕 recolor greens → pinks
      - name: Recolor snake to pink
        run: |
          chmod +w dist/github-contribution-grid-snake*.svg
          sed -i 's/#40c463/#ff69b4/g' dist/github-contribution-grid-snake.svg
          sed -i 's/#30a14e/#ffb6c1/g' dist/github-contribution-grid-snake.svg
          sed -i 's/#216e39/#ff1493/g' dist/github-contribution-grid-snake.svg

          sed -i 's/#40c463/#ff69b4/g' dist/github-contribution-grid-snake-dark.svg
          sed -i 's/#30a14e/#ffb6c1/g' dist/github-contribution-grid-snake-dark.svg
          sed -i 's/#216e39/#ff1493/g' dist/github-contribution-grid-snake-dark.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
