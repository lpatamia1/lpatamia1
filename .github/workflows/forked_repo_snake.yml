name: forked snake

on:
  # Allows manual trigger
  workflow_dispatch:

  # Runs daily
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Step 1 — Generate snake SVG with pink theme
      - name: Generate github-contribution-grid-snake.svg (pink)
        uses: lpatamia1/snk@main
        # This is the forked repo meaning I copied it from Platane's project inside my account
        # The workflow can run a customized version of that action
        # I can edit the code freely to pastel pinks
        with:
          github_user_name: ${{ github.repository_owner }}
          # The color customization happens here 👇
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          color_snake: ff69b4
          color_dots: "#ffb6c1,#ffc0cb,#ff69b4,#ff1493,#ffc0cb"

      # Step 2 — Push to output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
